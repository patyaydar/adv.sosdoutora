function Monogram({ size = 42 }) {
  return (
    <img src={MONO} alt="Monograma Patricia Aydar" style={{

}

function SectionTitle({ eyebrow, children }) {
  return (
    <div style={{ marginBottom: 18 }}>
      {eyebrow && (
        <div style={{ color: C.muted, fontSize: 12, letterSpacing: "0.14em", textTransform: "uppercase", marginBottom: 4 }}>
          {eyebrow}

        {children}
      </h1>
      <div style={{ width: 46, height: 3, background: C.gold, borderRadius: 2, marginTop: 8 }} />
    </div>
  );
}

function Card({ children, style, onClick }) {
  return (
    <div onClick={onClick} style={{
      background: C.card, border: `1px solid ${C.line}`, borderRadius: 16,
      padding: 18, boxShadow: "0 1px 2px rgba(67,16,31,0.04)",
      ...(onClick ? { cursor: "pointer" } : {}), ...style,
    }}>{children}</div>
  );
}

function Pill({ tone, children }) {
  return (
    <span style={{
      background: tone.bg, color: tone.fg, fontSize: 11.5, fontWeight: 600,
      padding: "3px 10px", borderRadius: 999, whiteSpace: "nowrap",
    }}>{children}</span>
  );
}

function Prazos() {

function IA() {
  const [chat, setChat] = useState([
    { from: "bot", txt: "Olá! Sou o atendimento virtual do escritório da Dra. Patricia Aydar. Posso entender seu caso e ajudar a agendar uma consulta." },
  ]);
  const send = (area) => {
    const resp = {
      "Divórcio": "Entendi — questões de divórcio. Já existe acordo entre as partes ou o processo será litigioso? Vou anotar e a Dra. Patricia analisa antes da consulta.",
      "Inventário": "Certo, inventário/sucessões. Você sabe se há testamento e quantos herdeiros? Com isso já preparo um resumo para a consulta.",
      "Guarda / Alimentos": "Anotado — guarda e alimentos. Posso te oferecer os horários de consulta desta semana. Prefere manhã ou tarde?",
    }[area];
    setChat((c) => [...c, { from: "user", txt: area }, { from: "bot", txt: resp }]);
  };
  return (
    <div>
      <SectionTitle eyebrow="Triagem e agendamento — não presta orientação jurídica">Atendimento com IA</SectionTitle>

      <div style={{ display: "flex", alignItems: "flex-start", gap: 8, background: C.amberBg, color: C.amber, padding: "10px 14px", borderRadius: 12, marginBottom: 14, fontSize: 12.5 }}>
        <AlertTriangle size={15} style={{ flexShrink: 0, marginTop: 1 }} />
        <span>A IA faz triagem inicial, responde dúvidas gerais e agenda. Ela <strong>não dá orientação jurídica</strong> nem substitui a advogada — respeitando os limites da OAB.</span>
      </div>

      <Card style={{ padding: 0, overflow: "hidden" }}>
        <div style={{ background: C.wine, color: "#fff", padding: "12px 16px", display: "flex", alignItems: "center", gap: 8 }}>
          <Bot size={17} color={C.goldSoft} /> <span style={{ fontWeight: 600 }}>Assistente do escritório</span>
        </div>
        <div style={{ padding: 16, maxHeight: 320, overflowY: "auto", background: C.paper }}>
          {chat.map((m, i) => (
            <div key={i} style={{ display: "flex", justifyContent: m.from === "bot" ? "flex-start" : "flex-end", marginBottom: 10 }}>
              <div style={{
                maxWidth: "78%", padding: "9px 13px", borderRadius: 14, fontSize: 13.5, lineHeight: 1.45,
                background: m.from === "bot" ? "#fff" : C.wine, color: m.from === "bot" ? C.ink : "#fff",
                border: m.from === "bot" ? `1px solid ${C.line}` : "none",
              }}>{m.txt}</div>
            </div>
          ))}
        </div>
        <div style={{ padding: 12, borderTop: `1px solid ${C.line}`, background: "#fff", display: "flex", gap: 8, flexWrap: "wrap" }}>
          {["Divórcio", "Inventário", "Guarda / Alimentos"].map((a) => (
            <button key={a} onClick={() => send(a)} style={{ background: "#fff", border: `1px solid ${C.wine}`, color: C.wine, fontSize: 13, fontWeight: 600, padding: "8px 12px", borderRadius: 999, cursor: "pointer" }}>{a}</button>
          ))}
          <button style={{ marginLeft: "auto", background: C.wine, color: "#fff", border: "none", padding: "8px 14px", borderRadius: 999, display: "inline-flex", gap: 6, alignItems: "center", fontWeight: 600, cursor: "pointer" }}>
            <Send size={14} /> Enviar
          </button>
        </div>
      </Card>
    </div>
  );
}
