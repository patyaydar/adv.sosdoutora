name: Teste DJEN

# Roda só quando você clicar (botão "Run workflow")
on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar DJEN a partir do IP do GitHub
        run: |
          FIM=$(date +%F)
          INI=$(date -d '-15 days' +%F)
          URL="https://comunicaapi.pje.jus.br/api/v1/comunicacao?numeroOab=302090&ufOab=SP&dataDisponibilizacaoInicio=${INI}&dataDisponibilizacaoFim=${FIM}&meio=D&pagina=1&itensPorPagina=5"
          echo "URL: $URL"
          CODE=$(curl -s -o resposta.txt -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Referer: https://comunica.pje.jus.br/" \
            "$URL")
          echo "=================================="
          echo "HTTP: $CODE"
          echo "=================================="
          echo "Primeiros 400 caracteres da resposta:"
          head -c 400 resposta.txt
